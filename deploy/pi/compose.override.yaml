# Raspberry Pi overrides for deploy/compose.deploy.yaml.
#
# The database lives on external storage, never on the SD card: SD cards
# corrupt under write-loss and the cheap ones misreport flushes, which
# undermines Postgres's own crash-safety. HOME_DATA_DIR is the mount point of
# that disk (see SETUP.md, phase 3).

services:
  db:
    volumes:
      - ${HOME_DATA_DIR:?set HOME_DATA_DIR in deploy/.env}/postgres:/var/lib/postgresql/data
