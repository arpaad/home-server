# H.O.M.E. stack: the API (which also serves the built client) and Postgres.
#
# The published port defaults to loopback. On the Raspberry Pi set
# HOME_BIND_ADDRESS to the Pi's LAN address in deploy/.env. Do not bind this
# to a public interface: this release has no authentication.

name: home

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home}
      POSTGRES_DB: ${POSTGRES_DB:-home}
      # Keep the cluster in a subdirectory so the volume root may hold a
      # lost+found, as it does on an external ext4 disk.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - home-db:/var/lib/postgresql/data
    ports:
      - "${HOME_DB_BIND_ADDRESS:-127.0.0.1}:${HOME_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home} -d ${POSTGRES_DB:-home}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${HOME_IMAGE:-localhost/home-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME_ENVIRONMENT: ${HOME_ENVIRONMENT:-production}
      HOME_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-home}:${POSTGRES_PASSWORD:-home}@db:5432/${POSTGRES_DB:-home}
      HOME_HOUSEHOLD_TIMEZONE: ${HOME_HOUSEHOLD_TIMEZONE:-Europe/Budapest}
    ports:
      - "${HOME_BIND_ADDRESS:-127.0.0.1}:${HOME_PORT:-8080}:8080"

volumes:
  home-db:
