[tool.poetry]
name = "home-server"
version = "0.1.0"
description = "Modular H.O.M.E. automation backend"
authors = ["Arpad Szabo <arpad2000@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.121.2"
uvicorn =  { extras = ["standard"], version = "^0.38.0" }
pydantic = "^2.12.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
black = "^25.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
